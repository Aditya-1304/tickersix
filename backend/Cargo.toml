[package]
name = "backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8.9"
aes-gcm = "0.10.3"
bs58 = "0.5.1"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
market-data = { path = "../crates/market-data" }
protocol = { path = "../crates/protocol" }
rand = "0.8.5"
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.6.3", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
